<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PinkCalc Shop</title><style>body{font-family:system-ui;background:#fff3f8;color:#572c41;margin:0}.wrap{max-width:850px;margin:auto;padding:20px}header{background:linear-gradient(135deg,#f8bfd6,#ffeaf3);padding:24px;text-align:center;border-radius:0 0 25px 25px}h1{margin:0;color:#862a56}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #f2d0e0;border-radius:18px;padding:14px;box-shadow:0 5px 16px #d79ab322}.card img{width:100%;height:170px;object-fit:cover;border-radius:12px}button{border:0;background:#d86b99;color:white;border-radius:12px;padding:11px;font-weight:700;cursor:pointer}.card button{width:100%}input{padding:11px;border:1px solid #edcddd;border-radius:10px;width:100%;box-sizing:border-box}.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #f3dce6;padding:9px 0}.muted{color:#976e82;font-size:13px}footer{position:sticky;bottom:0;background:#fff9fced;border-top:1px solid #f2d0e0;padding:12px}#send{width:100%}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><h1>🎀 PinkCalc Shop</h1><p>Tu catálogo de compras 💗</p></header><main class="wrap"><h2>🛍️ Productos disponibles</h2><div id="products" class="grid"></div><h2>🛒 Mi carrito</h2><div id="cart"></div><div class="card"><label>Tu nombre para el pedido</label><input id="customer" placeholder="Escribí tu nombre"></div><p class="muted">Los precios están expresados en córdobas nicaragüenses. El pedido se envía por WhatsApp y queda pendiente de confirmación.</p></main><footer><b id="total">Total C$ 0.00</b><button id="send">💬 Enviar pedido por WhatsApp</button></footer><script>
const PHONE='50576918637',money=n=>'C$ '+Number(n).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2}),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],cart={};fetch('./catalogo.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Catálogo no publicado');return r.json()}).then(d=>{products=(d.products||[]).filter(x=>Number(x.disponibles)>0&&Number(x.precio)>0);render()}).catch(()=>document.getElementById('products').textContent='No se pudo cargar el catálogo. Intentá nuevamente.');function render(){document.getElementById('products').innerHTML=products.map(x=>`<div class="card">${x.foto?`<img src="${safe(x.foto)}" alt="${safe(x.nombre)}">`:'<div style="height:170px;text-align:center;font-size:70px">🛍️</div>'}<h3>${safe(x.nombre)}</h3><p><b>${money(x.precio)}</b></p><p class="muted">Disponibles: ${x.disponibles}</p><button data-id="${safe(x.id)}">➕ Agregar al carrito</button></div>`).join('')||'<p>Próximamente tendremos productos disponibles 💗</p>';renderCart()}function renderCart(){let total=0;document.getElementById('cart').innerHTML=products.filter(x=>cart[x.id]).map(x=>{total+=x.precio*cart[x.id];return `<div class="line"><span>${safe(x.nombre)} × ${cart[x.id]}</span><span>${money(x.precio*cart[x.id])} <button data-remove="${safe(x.id)}">−</button></span></div>`}).join('')||'<p>Tu carrito está vacío.</p>';document.getElementById('total').textContent='Total '+money(total)}document.getElementById('products').onclick=e=>{let b=e.target.closest('button[data-id]');if(!b)return;let x=products.find(x=>x.id===b.dataset.id);if(!x)return;if((cart[x.id]||0)>=x.disponibles)return alert('No hay más unidades disponibles.');cart[x.id]=(cart[x.id]||0)+1;renderCart()};document.getElementById('cart').onclick=e=>{let b=e.target.closest('button[data-remove]');if(!b)return;cart[b.dataset.remove]=Math.max(0,(cart[b.dataset.remove]||0)-1);renderCart()};document.getElementById('send').onclick=()=>{let chosen=products.filter(x=>cart[x.id]),name=document.getElementById('customer').value.trim();if(!chosen.length)return alert('Agregá al menos un producto.');if(!name)return alert('Escribí tu nombre.');let total=chosen.reduce((n,x)=>n+x.precio*cart[x.id],0),msg='¡Hola! Quiero hacer un pedido en PinkCalc Shop 💗\nCliente: '+name+'\n\n'+chosen.map(x=>'• '+x.nombre+' × '+cart[x.id]+' — '+money(x.precio*cart[x.id])).join('\n')+'\n\nTotal: '+money(total)+'\n¿Me confirmás disponibilidad?';location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)};
</script></body></html>
